<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171e1a">
  <meta name="description" content="Winehouse — bağımsız şarapçılık oyunu.">
  <title>Winehouse | Şarapçılık Oyunu</title>
  <style>
    :root{color-scheme:dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 70% 20%,#34443a 0%,#171e1a 46%,#101512 100%);color:#f5f0e7;display:flex;align-items:center;justify-content:center;padding:24px}
    main{width:min(100%,640px);text-align:center;padding:64px 28px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08;box-shadow:0 24px 100px #0004}
    .mark{font-size:56px;line-height:1;margin-bottom:24px}
    .eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#c0b6a2}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,9vw,76px);font-weight:400;letter-spacing:-.05em;margin:10px 0 18px}
    p{font-size:16px;line-height:1.75;color:#dbd6cb;max-width:420px;margin:0 auto 28px}
    .status{display:inline-flex;align-items:center;gap:9px;border-radius:999px;background:#e7c88a12;border:1px solid #e7c88a55;color:#ead6a9;padding:10px 18px;font-size:13px}
    .dot{height:7px;width:7px;background:#d4ae6f;border-radius:50%}
    footer{margin-top:52px;color:#948e84;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🍷</div>
    <div class="eyebrow">Bağımsız oyun projesi</div>
    <h1>Winehouse</h1>
    <p>Bağlardan mahzenlere uzanan bir şarapçılık dünyası. Winehouse'un oyun deneyimi hazırlanıyor.</p>
    <div class="status"><span class="dot"></span>Geliştirme aşamasında</div>
    <footer>Winehouse · Bağımsız GitHub ve Vercel projesi</footer>
  </main>
</body>
</html>
